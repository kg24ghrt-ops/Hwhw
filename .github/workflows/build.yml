name: Build and Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Get the source code
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Install Bun
      # --------------------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      # --------------------------------------------------
      # 3. Show Bun version
      # --------------------------------------------------
      - name: Show Bun version
        run: bun --version

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --------------------------------------------------
      # 5. Build the production website
      # --------------------------------------------------
      - name: Build production bundle
        run: bun run build

      # --------------------------------------------------
      # 6. Verify the build
      # --------------------------------------------------
      - name: Verify build
        run: |
          test -d dist
          test -f dist/index.html

          echo "Build successful."
          echo "Build size:"
          du -sh dist/

          echo "Build contents:"
          find dist -maxdepth 2 -type f | sort

      # --------------------------------------------------
      # 7. Prepare the Hugging Face deployment
      #
      # IMPORTANT:
      # The HF Space receives ONLY:
      #
      #   README.md
      #   index.html
      #   assets/
      #
      # The GitHub source code is NOT deployed.
      # --------------------------------------------------
      - name: Prepare Hugging Face deployment
        run: |
          rm -rf .hf-deploy
          mkdir -p .hf-deploy

          # Copy the compiled website to the HF Space root.
          cp -a dist/. .hf-deploy/

          # Generate the Hugging Face Space configuration.
          #
          # This tells HF:
          #   - this is a static Space
          #   - do NOT build the project
          #   - serve index.html directly
          cat > .hf-deploy/README.md <<'EOF'
          ---
          title: Gwyw
          emoji: 🌐
          colorFrom: blue
          colorTo: indigo
          sdk: static
          app_file: index.html
          pinned: false
          ---

          Gwyw — static web application.
          EOF

          # Make sure the final deployment is valid.
          test -f .hf-deploy/README.md
          test -f .hf-deploy/index.html

          echo "======================================"
          echo "Hugging Face deployment:"
          echo "======================================"

          find .hf-deploy -maxdepth 2 -type f | sort

          echo "======================================"
          echo "Deployment size:"
          du -sh .hf-deploy/

      # --------------------------------------------------
      # 8. Keep a GitHub Actions build artifact
      # --------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # --------------------------------------------------
      # 9. Deploy the prepared static site to HF
      # --------------------------------------------------
      - name: Deploy to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Novacibes/Gwyw
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          subdirectory: .hf-deploy